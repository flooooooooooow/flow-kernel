name: Kernel CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tinycore-x86_64:
    name: Tiny Core CorePure64 boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Flow kernel integration
        uses: actions/checkout@v7

      - name: Install boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            file \
            qemu-system-x86

      - name: Cache Tiny Core base
        uses: actions/cache@v4
        with:
          path: /tmp/tinycore
          key: tinycore-corepure64-17.0-linux-6.18.2

      - name: Fetch and verify Tiny Core Linux base
        env:
          TC_MAJOR: 17.x
          TC_VERSION: '17.0'
          TC_KERNEL: 6.18.2-tinycore64
        run: |
          bash tinycore/fetch.sh /tmp/tinycore
          test -s /tmp/tinycore/vmlinuz64
          test -s /tmp/tinycore/corepure64.gz
          test -s /tmp/tinycore/manifest.txt
          file /tmp/tinycore/vmlinuz64
          gzip -t /tmp/tinycore/corepure64.gz
          cat /tmp/tinycore/manifest.txt

      - name: Record upstream kernel configuration
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/tinycore/config-6.18.2-tinycore64 \
            https://www.tinycorelinux.net/17.x/x86_64/release/src/kernel/config-6.18.2-tinycore64

          grep -E '^(CONFIG_BPF|CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_KPROBES|CONFIG_BPF_EVENTS|CONFIG_DEBUG_INFO_BTF)=' \
            /tmp/tinycore/config-6.18.2-tinycore64 || true

      - name: Boot Tiny Core kernel under QEMU
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -machine accel=tcg \
            -cpu max \
            -m 256M \
            -kernel /tmp/tinycore/vmlinuz64 \
            -initrd /tmp/tinycore/corepure64.gz \
            -append 'console=ttyS0' \
            -serial file:/tmp/tinycore-serial.log \
            -display none \
            -no-reboot \
            -no-shutdown
          rc=$?
          set -e

          cat /tmp/tinycore-serial.log
          if [[ "$rc" -ne 0 && "$rc" -ne 124 ]]; then
            echo "QEMU exited unexpectedly with status $rc" >&2
            exit "$rc"
          fi

          grep -F 'Linux version 6.18.2-tinycore64' /tmp/tinycore-serial.log

      - name: Verify Flow compiler remains external
        run: |
          git clone --depth 1 https://github.com/flooooooooooow/flow.git /tmp/flow
          test -x /tmp/flow/flow
          test ! -e ./flow

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinycore-x86_64-verification
          path: |
            /tmp/tinycore-serial.log
            /tmp/tinycore/manifest.txt
            /tmp/tinycore/config-6.18.2-tinycore64
          if-no-files-found: warn
          retention-days: 7
